<div class="modal fade" id="hint-confirm-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content cave-bg">
      <div class="modal-header">
        <h5 class="modal-title text-uppercase">{% trans %}Desbloquear pista.{% endtrans %}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">{% trans %}¿Seguro que quieres desbloquear esta pista?{% endtrans %}</p>
        <p class="my-2">{% trans %} Esto te restara puntos.{% endtrans %}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans %}Cancelar{% endtrans %}</button>
        <button type="button" class="btn btn-danger" id="hint-confirm-accept">{% trans %}Desbloquear{% endtrans %}</button>
      </div>
    </div>
  </div>
</div>
