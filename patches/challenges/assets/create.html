{% extends "admin/challenges/create.html" %}

{% block category %}
{{ super() }}
<div class="form-group" data-challenge-icon>
	<label>
		Icon:<br>
		<small class="form-text text-muted">
			Image shown on the challenge card. Upload a file or paste an image URL.
		</small>
	</label>
	<input type="text" class="form-control" name="icon" placeholder="https://... or /files/...">
	<div class="custom-file mt-2">
		<input type="file" class="custom-file-input" id="challenge-icon-file-create" accept="image/*" data-challenge-icon-upload>
		<label class="custom-file-label" for="challenge-icon-file-create">Upload image</label>
	</div>
	<small class="form-text text-muted">PNG, JPG, GIF, WEBP or SVG. Max 2 MB.</small>
	<div class="mt-2" data-icon-preview></div>
</div>
<script src="{{ script_root }}/plugins/challenges/assets/icon.js"></script>
{% endblock %}
